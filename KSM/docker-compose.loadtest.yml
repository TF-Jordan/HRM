services:
  k6:
    image: grafana/k6:0.49.0
    profiles: ["loadtest"]
    environment:
      IWM_BASE_URL: http://gateway:8080
      IWM_MANAGEMENT_URL: http://app:8081
      IWM_BOOTSTRAP_CLIENT_ID: ${IWM_BOOTSTRAP_CLIENT_ID:-dev-platform-backend}
      IWM_BOOTSTRAP_CLIENT_SECRET: ${IWM_BOOTSTRAP_CLIENT_SECRET:-dev-api-key}
      IWM_MANAGEMENT_API_KEY: ${IWM_MANAGEMENT_API_KEY:-dev-management-key}
      IWM_K6_TENANT_ID: ${IWM_K6_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      IWM_K6_STAGE1_DURATION: ${IWM_K6_STAGE1_DURATION:-30s}
      IWM_K6_STAGE1_TARGET: ${IWM_K6_STAGE1_TARGET:-20}
      IWM_K6_STAGE2_DURATION: ${IWM_K6_STAGE2_DURATION:-60s}
      IWM_K6_STAGE2_TARGET: ${IWM_K6_STAGE2_TARGET:-50}
      IWM_K6_STAGE3_DURATION: ${IWM_K6_STAGE3_DURATION:-30s}
      IWM_K6_STAGE3_TARGET: ${IWM_K6_STAGE3_TARGET:-0}
      IWM_K6_ENDURANCE_VUS: ${IWM_K6_ENDURANCE_VUS:-20}
      IWM_K6_ENDURANCE_DURATION: ${IWM_K6_ENDURANCE_DURATION:-15m}
      IWM_K6_SPIKE_BASELINE_DURATION: ${IWM_K6_SPIKE_BASELINE_DURATION:-20s}
      IWM_K6_SPIKE_BASELINE_TARGET: ${IWM_K6_SPIKE_BASELINE_TARGET:-10}
      IWM_K6_SPIKE_DURATION: ${IWM_K6_SPIKE_DURATION:-20s}
      IWM_K6_SPIKE_TARGET: ${IWM_K6_SPIKE_TARGET:-120}
      IWM_K6_SPIKE_RECOVERY_DURATION: ${IWM_K6_SPIKE_RECOVERY_DURATION:-40s}
      IWM_K6_SPIKE_RECOVERY_TARGET: ${IWM_K6_SPIKE_RECOVERY_TARGET:-10}
      IWM_K6_SPIKE_COOLDOWN_DURATION: ${IWM_K6_SPIKE_COOLDOWN_DURATION:-20s}
      IWM_K6_SATURATION_STAGE1_DURATION: ${IWM_K6_SATURATION_STAGE1_DURATION:-30s}
      IWM_K6_SATURATION_STAGE1_TARGET: ${IWM_K6_SATURATION_STAGE1_TARGET:-25}
      IWM_K6_SATURATION_STAGE2_DURATION: ${IWM_K6_SATURATION_STAGE2_DURATION:-30s}
      IWM_K6_SATURATION_STAGE2_TARGET: ${IWM_K6_SATURATION_STAGE2_TARGET:-75}
      IWM_K6_SATURATION_STAGE3_DURATION: ${IWM_K6_SATURATION_STAGE3_DURATION:-30s}
      IWM_K6_SATURATION_STAGE3_TARGET: ${IWM_K6_SATURATION_STAGE3_TARGET:-150}
      IWM_K6_SATURATION_STAGE4_DURATION: ${IWM_K6_SATURATION_STAGE4_DURATION:-30s}
      IWM_K6_SATURATION_STAGE4_TARGET: ${IWM_K6_SATURATION_STAGE4_TARGET:-0}
    volumes:
      - ./ops/k6:/scripts:ro
    command: ["run", "/scripts/smoke.js"]
    networks:
      - iwm
