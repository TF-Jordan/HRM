name: IWM CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
      - "hotfix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: iwm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -q -DskipTests compile

  unit-memory:
    name: Unit And Memory Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run standard test suite
        run: mvn -q test

  legacy-parity:
    name: Legacy Parity Non Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iwm
          POSTGRES_USER: iwm
          POSTGRES_PASSWORD: iwm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iwm -d iwm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      IWM_R2DBC_URL: r2dbc:postgresql://localhost:5432/iwm
      IWM_R2DBC_USERNAME: iwm
      IWM_R2DBC_PASSWORD: iwm
      IWM_LIQUIBASE_URL: jdbc:postgresql://localhost:5432/iwm
      IWM_LIQUIBASE_USERNAME: iwm
      IWM_LIQUIBASE_PASSWORD: iwm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U iwm -d iwm && exit 0
            sleep 2
          done
          exit 1

      - name: Run legacy parity memory checks
        run: ./scripts/run-legacy-parity.sh memory

      - name: Run legacy parity PostgreSQL checks
        run: ./scripts/run-legacy-parity.sh r2dbc

  architecture-guards:
    name: Architecture Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run architecture guard tests
        run: >
          mvn -q -pl iwm-bootstrap -am
          -Dtest=SearchAdapterArchitectureTests,IntegrationAdapterArchitectureTests,HexagonalModuleArchitectureTests
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  contracts-postgres:
    name: PostgreSQL Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iwm
          POSTGRES_USER: iwm
          POSTGRES_PASSWORD: iwm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iwm -d iwm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      IWM_R2DBC_URL: r2dbc:postgresql://localhost:5432/iwm
      IWM_R2DBC_USERNAME: iwm
      IWM_R2DBC_PASSWORD: iwm
      IWM_LIQUIBASE_URL: jdbc:postgresql://localhost:5432/iwm
      IWM_LIQUIBASE_USERNAME: iwm
      IWM_LIQUIBASE_PASSWORD: iwm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U iwm -d iwm && exit 0
            sleep 2
          done
          exit 1

      - name: Run contract suites
        run: >
          mvn -q -pl iwm-bootstrap -am
          -Diwm.tests.r2dbc.enabled=true
          -Dtest=IdentityAccessContractTests,OrganizationCatalogContractTests,SalesInventoryContractTests,AccountingTreasuryContractTests,ResourceContractTests
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  kafka-integration:
    name: Kafka Outbox Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Kafka integration
        run: >
          mvn -q -Dtest=KafkaOutboxIntegrationTests
          -Diwm.tests.kafka.enabled=true
          -pl iwm-bootstrap -am
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  search-smoke:
    name: Elasticsearch Search Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iwm
          POSTGRES_USER: iwm
          POSTGRES_PASSWORD: iwm
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U iwm -d iwm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        ports:
          - 9200:9200
        options: >-
          -e discovery.type=single-node
          -e xpack.security.enabled=false
          -e ES_JAVA_OPTS=-Xms512m -Xmx512m
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    env:
      IWM_R2DBC_URL: r2dbc:postgresql://localhost:54329/iwm
      IWM_R2DBC_USERNAME: iwm
      IWM_R2DBC_PASSWORD: iwm
      IWM_LIQUIBASE_URL: jdbc:postgresql://localhost:54329/iwm
      IWM_LIQUIBASE_USERNAME: iwm
      IWM_LIQUIBASE_PASSWORD: iwm
      IWM_ELASTICSEARCH_URIS: http://localhost:9200
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 54329 -U iwm -d iwm && exit 0
            sleep 2
          done
          exit 1

      - name: Wait for Elasticsearch
        run: |
          for i in {1..60}; do
            curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s && exit 0
            sleep 2
          done
          exit 1

      - name: Run Elasticsearch search smoke
        run: >
          mvn -q -pl iwm-bootstrap -am
          -Diwm.tests.search.enabled=true
          -Dtest=SearchSmokeIntegrationTests
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  observability-stack-smoke:
    name: Observability Stack Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start full stack
        run: >
          docker compose
          -f docker-compose.infrastructure.yml
          -f docker-compose.application.yml
          up -d --build

      - name: Wait for application management health
        run: |
          for i in {1..60}; do
            curl -fsS http://localhost:8081/actuator/health >/dev/null && exit 0
            sleep 5
          done
          exit 1

      - name: Run observability smoke
        env:
          MANAGEMENT_URL: http://localhost:8081
          MANAGEMENT_API_KEY: dev-management-key
          PROMETHEUS_URL: http://localhost:9090
          GRAFANA_URL: http://localhost:3000
        run: ./scripts/smoke-observability.sh

      - name: Dump compose logs on failure
        if: failure()
        run: >
          docker compose
          -f docker-compose.infrastructure.yml
          -f docker-compose.application.yml
          logs --no-color

      - name: Stop full stack
        if: always()
        run: >
          docker compose
          -f docker-compose.infrastructure.yml
          -f docker-compose.application.yml
          down -v
