services:
  postgres:
    image: postgres:16-alpine
    container_name: iwm-postgres
    environment:
      POSTGRES_DB: iwm
      POSTGRES_USER: iwm
      POSTGRES_PASSWORD: iwm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iwm -d iwm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - iwm-postgres-data:/var/lib/postgresql/data
    networks:
      - iwm

  redis:
    image: redis:7-alpine
    container_name: iwm-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - iwm-redis-data:/data
    networks:
      - iwm

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: iwm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 30"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - iwm

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: iwm-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - iwm

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: iwm-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E '\"status\":\"(yellow|green)\"' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    volumes:
      - iwm-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - iwm

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: iwm-redis-exporter
    depends_on:
      redis:
        condition: service_healthy
    command:
      - --redis.addr=redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - iwm

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0
    container_name: iwm-elasticsearch-exporter
    depends_on:
      elasticsearch:
        condition: service_healthy
    command:
      - --es.uri=http://elasticsearch:9200
    ports:
      - "9114:9114"
    networks:
      - iwm

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: iwm-prometheus
    depends_on:
      redis-exporter:
        condition: service_started
      elasticsearch-exporter:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts:/etc/prometheus/alerts:ro
      - iwm-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iwm

  grafana:
    image: grafana/grafana:11.2.0
    container_name: iwm-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - iwm-grafana-data:/var/lib/grafana
    networks:
      - iwm

volumes:
  iwm-postgres-data:
  iwm-redis-data:
  iwm-elasticsearch-data:
  iwm-prometheus-data:
  iwm-grafana-data:

networks:
  iwm:
    name: iwm-network
