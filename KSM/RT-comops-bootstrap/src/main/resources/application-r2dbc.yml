spring:
  config:
    activate:
      on-profile: r2dbc
  r2dbc:
    url: ${IWM_R2DBC_URL:r2dbc:postgresql://localhost:5432/iwm}
    username: ${IWM_R2DBC_USERNAME:iwm}
    password: ${IWM_R2DBC_PASSWORD:iwm}
    pool:
      enabled: ${IWM_R2DBC_POOL_ENABLED:true}
      initial-size: ${IWM_R2DBC_POOL_INITIAL_SIZE:10}
      max-size: ${IWM_R2DBC_POOL_MAX_SIZE:50}
      max-idle-time: ${IWM_R2DBC_POOL_MAX_IDLE_TIME:30m}
      max-acquire-time: ${IWM_R2DBC_POOL_MAX_ACQUIRE_TIME:10s}
      max-create-connection-time: ${IWM_R2DBC_POOL_MAX_CREATE_CONNECTION_TIME:10s}
      validation-query: ${IWM_R2DBC_POOL_VALIDATION_QUERY:SELECT 1}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: ${IWM_LIQUIBASE_URL:jdbc:postgresql://localhost:5432/iwm}
    user: ${IWM_LIQUIBASE_USERNAME:${IWM_R2DBC_USERNAME:iwm}}
    password: ${IWM_LIQUIBASE_PASSWORD:${IWM_R2DBC_PASSWORD:iwm}}

iwm:
  persistence:
    mode: r2dbc
