spring:
  config:
    import: optional:configtree:/run/secrets/

management:
  health:
    elasticsearch:
      enabled: true
    redis:
      enabled: true

iwm:
  quotas:
    tenant-requests:
      enabled: ${IWM_TENANT_REQUEST_QUOTA_ENABLED:true}
      limit: ${IWM_TENANT_REQUEST_QUOTA_LIMIT:2400}
      window: ${IWM_TENANT_REQUEST_QUOTA_WINDOW:1m}
      fail-open: ${IWM_TENANT_REQUEST_QUOTA_FAIL_OPEN:false}
      core-service-code: ${IWM_TENANT_REQUEST_QUOTA_CORE_SERVICE_CODE:CORE}
    organization-service-requests:
      enabled: ${IWM_ORGANIZATION_SERVICE_REQUEST_QUOTA_ENABLED:true}
      fail-open: ${IWM_ORGANIZATION_SERVICE_REQUEST_QUOTA_FAIL_OPEN:false}
  organization:
    service-subscriptions:
      default-request-quota-limit: ${IWM_ORGANIZATION_SERVICE_DEFAULT_REQUEST_QUOTA_LIMIT:10000}
      default-request-quota-window: ${IWM_ORGANIZATION_SERVICE_DEFAULT_REQUEST_QUOTA_WINDOW:1m}
  redis:
    permission-cache:
      enabled: true
  search:
    elasticsearch:
      enabled: true
  outbox:
    relay:
      enabled: ${IWM_OUTBOX_RELAY_ENABLED:true}
    replay-on-startup:
      enabled: ${IWM_OUTBOX_REPLAY_ON_STARTUP_ENABLED:true}
    allow-manual-relay-only: ${IWM_OUTBOX_ALLOW_MANUAL_RELAY_ONLY:false}
