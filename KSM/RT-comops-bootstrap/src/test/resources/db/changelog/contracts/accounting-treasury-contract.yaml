databaseChangeLog:
  - include:
      file: db/changelog/db.changelog-master.yaml
  - changeSet:
      id: contract-cleanup
      author: Blhack
      runAlways: true
      changes:
        - sqlFile:
            path: sql/contract-cleanup.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
  - changeSet:
      id: accounting-treasury-contract-seed
      author: Blhack
      runAlways: true
      changes:
        - sqlFile:
            path: sql/accounting-treasury-contract-seed.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
