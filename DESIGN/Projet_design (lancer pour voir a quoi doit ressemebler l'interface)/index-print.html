<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440"/>
<title>HR Core — RT-Comops · PDF Export</title>
<link rel="stylesheet" href="styles.css"/>
<style>
  /* Force background colors in print */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

  /* Disable all animations / transitions */
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }

  body::before, body::after { display: none !important; }

  /* Hide chrome we don't need: topbar */
  .topbar { display: none !important; }

  /* Hide sidebar for print — show full content on each page */
  .sidebar { display: none !important; }
  .app { grid-template-columns: 1fr !important; }

  .page {
    padding: 24px 36px 36px 36px !important;
    max-width: 100% !important;
  }

  /* Each print-section is a full page */
  .print-section {
    break-before: page;
    page-break-before: always;
    padding: 0;
  }
  .print-section:first-of-type {
    break-before: auto;
    page-break-before: auto;
  }

  /* Section divider banner */
  .print-section-banner {
    padding: 18px 28px;
    background: var(--grad-orange);
    color: #fff;
    margin: 0 -36px 24px -36px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-radius: 0;
  }
  .print-section-banner .num {
    font-family: 'Inter Tight';
    font-size: 28px;
    font-weight: 800;
    opacity: 0.7;
    width: 56px;
  }
  .print-section-banner .meta-uc {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.8;
    font-weight: 600;
  }
  .print-section-banner .meta-title {
    font-family: 'Inter Tight';
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* Avoid weird splits */
  .card, .kpi, .kpi-mini, table.t, .lrow {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Hide scrollbars */
  ::-webkit-scrollbar { display: none; }

  @page { size: A4 landscape; margin: 8mm; }

  /* Print cover page */
  .print-cover {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
      radial-gradient(circle at 30% 20%, rgba(242,107,15,0.12) 0%, transparent 50%),
      radial-gradient(circle at 70% 80%, rgba(252,211,77,0.10) 0%, transparent 50%),
      linear-gradient(180deg, #F8F5EF 0%, #F1ECE0 100%);
    margin: 0 -36px;
    padding: 60px;
    break-after: page;
    page-break-after: always;
  }
  .print-cover-logo {
    width: 80px; height: 80px;
    border-radius: 22px;
    background: var(--grad-orange);
    color: #fff;
    display: grid;
    place-items: center;
    font-family: 'Inter Tight';
    font-weight: 800;
    font-size: 38px;
    box-shadow: 0 16px 48px -8px rgba(242,107,15,0.45);
    margin-bottom: 28px;
  }
  .print-cover h1 {
    font-family: 'Inter Tight';
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1;
    color: var(--ink);
  }
  .print-cover .sub {
    font-size: 18px;
    color: var(--ink-3);
    margin-top: 16px;
    max-width: 600px;
  }
  .print-cover .uc-tag {
    font-family: 'JetBrains Mono';
    font-size: 11px;
    color: var(--orange-700);
    background: var(--orange-50);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 24px;
    letter-spacing: 0.05em;
  }
  .print-cover .footer {
    position: absolute;
    bottom: 40px;
    left: 0; right: 0;
    font-size: 12px;
    color: var(--ink-3);
  }
  .print-toc {
    margin-top: 36px;
    text-align: left;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 900px;
  }
  .print-toc-item {
    padding: 12px 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow-xs);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .print-toc-item .toc-num {
    font-family: 'JetBrains Mono';
    font-size: 10px;
    color: var(--orange-600);
    font-weight: 600;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="lib/shell.jsx"></script>
<script type="text/babel" src="pages/dashboard.jsx"></script>
<script type="text/babel" src="pages/analytics.jsx"></script>
<script type="text/babel" src="pages/employees.jsx"></script>
<script type="text/babel" src="pages/contracts.jsx"></script>
<script type="text/babel" src="pages/skills.jsx"></script>
<script type="text/babel" src="pages/recruitment.jsx"></script>
<script type="text/babel" src="pages/time.jsx"></script>
<script type="text/babel" src="pages/leaves.jsx"></script>
<script type="text/babel" src="pages/missions.jsx"></script>
<script type="text/babel" src="pages/payroll.jsx"></script>
<script type="text/babel" src="pages/loans.jsx"></script>
<script type="text/babel" src="pages/expenses.jsx"></script>
<script type="text/babel" src="pages/reviews.jsx"></script>
<script type="text/babel" src="pages/trainings.jsx"></script>
<script type="text/babel" src="pages/budget.jsx"></script>
<script type="text/babel" src="pages/medical.jsx"></script>
<script type="text/babel" src="pages/declarations.jsx"></script>
<script type="text/babel" src="pages/settings.jsx"></script>

<script type="text/babel">
const PAGES = [
  { id:'dashboard',    title:'Tableau de bord',         uc:'01 · PILOTAGE',       comp: window.PageDashboard },
  { id:'analytics',    title:'Analytics RH',            uc:'02 · PILOTAGE',       comp: window.PageAnalytics },
  { id:'employees',    title:'Employés',                uc:'03 · PERSONNEL',      comp: window.PageEmployees },
  { id:'contracts',    title:'Contrats',                uc:'04 · PERSONNEL',      comp: window.PageContracts },
  { id:'skills',       title:'Compétences',             uc:'05 · PERSONNEL',      comp: window.PageSkills },
  { id:'recruitment',  title:'Recrutement',             uc:'06 · PERSONNEL',      comp: window.PageRecruitment },
  { id:'time',         title:'Temps & Présences',       uc:'07 · ACTIVITÉ',       comp: window.PageTime },
  { id:'leaves',       title:'Congés',                  uc:'08 · ACTIVITÉ',       comp: window.PageLeaves },
  { id:'missions',     title:'Ordres de mission',       uc:'09 · ACTIVITÉ',       comp: window.PageMissions },
  { id:'payroll',      title:'Paie',                    uc:'10 · RÉMUNÉRATION',   comp: window.PagePayroll },
  { id:'loans',        title:'Avances & Prêts',         uc:'11 · RÉMUNÉRATION',   comp: window.PageLoans },
  { id:'expenses',     title:'Notes de frais',          uc:'12 · RÉMUNÉRATION',   comp: window.PageExpenses },
  { id:'reviews',      title:'Évaluations',             uc:'13 · DÉVELOPPEMENT',  comp: window.PageReviews },
  { id:'trainings',    title:'Formations',              uc:'14 · DÉVELOPPEMENT',  comp: window.PageTrainings },
  { id:'budget',       title:'Budget formation',        uc:'15 · DÉVELOPPEMENT',  comp: window.PageBudget },
  { id:'medical',      title:'Suivi médical',           uc:'16 · CONFORMITÉ',     comp: window.PageMedical },
  { id:'declarations', title:'Déclarations',            uc:'17 · CONFORMITÉ',     comp: window.PageDeclarations },
  { id:'settings',     title:'Paramètres',              uc:'18 · SYSTÈME',        comp: window.PageSettings },
];

function PrintApp() {
  return (
    <div className="app">
      <div className="main">
        {/* Cover */}
        <div className="print-cover">
          <span className="uc-tag">DOCUMENT INTERNE · MAI 2026</span>
          <div className="print-cover-logo">H</div>
          <h1>HR Core</h1>
          <div className="sub">Système d'information ressources humaines · RT-Comops SARL · 342 collaborateurs · 6 sites · Yaoundé HQ</div>
          <div className="print-toc">
            {PAGES.map((p, i) => (
              <div key={p.id} className="print-toc-item">
                <span className="toc-num">{String(i+1).padStart(2,'0')}</span>
                <span>{p.title}</span>
              </div>
            ))}
          </div>
          <div className="footer">© 2026 RT-Comops · Confidentiel — pour usage interne uniquement</div>
        </div>

        {/* Pages */}
        {PAGES.map((p, i) => {
          const Comp = p.comp;
          return (
            <div key={p.id} className="page print-section" data-screen-label={p.id}>
              <div className="print-section-banner">
                <div className="num">{String(i+1).padStart(2,'0')}</div>
                <div>
                  <div className="meta-uc">{p.uc}</div>
                  <div className="meta-title">{p.title}</div>
                </div>
              </div>
              {Comp ? <Comp/> : <div style={{padding:60, textAlign:'center', color:'var(--ink-3)'}}>Page non disponible</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp/>);

// Auto-print once fonts + content are ready
(async () => {
  try { await document.fonts.ready; } catch (e) {}
  // wait a bit extra for charts/svg/react to settle
  setTimeout(() => window.print(), 1200);
})();
</script>

</body>
</html>
